spring:
  application:
    name: bankApp

  datasource:
    #if you're using docker you have to change 'localhost:5432' to 'postgres:5432'. docker compose name.
    url: ${SPRING_DATABASE_URL:jdbc:postgresql://localhost:5432/bankapp}
    username: ${SPRING_DATABASE_USERNAME:bankapp}
    password: ${SPRING_DATABASE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
api:
  security:
    token:
      secret: ${SPRING_API_KEY_SECURITY:isabela}